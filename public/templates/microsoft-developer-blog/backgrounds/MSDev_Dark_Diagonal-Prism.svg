<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <!-- Five-stop sweep rising bottom-left to top-right; brightness lands in the
         artwork corner so the title column stays dark. -->
    <linearGradient id="g" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#001632"/>
      <stop offset="0.38" stop-color="#001F3B"/>
      <stop offset="0.66" stop-color="#6631C2"/>
      <stop offset="0.86" stop-color="#A89FD9"/>
      <stop offset="1" stop-color="#D7C8EF"/>
    </linearGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" seed="23" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.035"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="1920" height="1080" fill="url(#g)"/>
  <rect width="1920" height="1080" filter="url(#grain)" opacity="0.5"/>
</svg>
