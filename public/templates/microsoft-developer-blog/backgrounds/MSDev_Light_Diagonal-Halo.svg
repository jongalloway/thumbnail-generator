<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <!-- Near-white corners with a saturated lavender band weighted past centre, so the
         colour sits behind the artwork rather than the text. -->
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F4F4F4"/>
      <stop offset="0.22" stop-color="#DBDBDB"/>
      <stop offset="0.48" stop-color="#D7C8EF"/>
      <stop offset="0.7" stop-color="#A89FD9"/>
      <stop offset="0.88" stop-color="#D7C8EF"/>
      <stop offset="1" stop-color="#F4F4F4"/>
    </linearGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" seed="43" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.035"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="1920" height="1080" fill="url(#g)"/>
  <rect width="1920" height="1080" filter="url(#grain)" opacity="0.5"/>
</svg>
